# The same checks as scripts/check.sh, on every push to main, every tag and every pull request.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt, clippy, test, release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (channel + rustfmt + clippy) on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: golden examples from the release binary
        env:
          SOURCE_DATE_EPOCH: "1793079600"
        run: |
          B=target/release/bonbagi-watcher E=examples/testnet
          set +e
          $B check --charter $E/charter.json --snapshot $E/snapshot.json --member 1 > all.txt; test $? = 1 || exit 1
          set -e
          diff -u $E/expected/all.txt all.txt
          $B check --charter $E/charter.json --snapshot $E/snapshot.json --key-file $E/dex-key.TEST-ONLY.txt \
            --order ord-k7m2qx9p --price 0.003 > paid.txt
          diff -u $E/expected/order-paid.txt paid.txt
          $B verify-receipt $E/expected/receipt.json --charter $E/charter.json > receipt.txt
          diff -u $E/expected/verify-receipt.txt receipt.txt

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1 .
